name: Base Images

# This file does NOT run in this repository. promote-to-public.yml installs it
# as .github/workflows/base-images.yml in the public repository, which is where
# it runs. The private repository builds its own base images with
# .github/workflows/base-images.yml.
#
# Builds the OS+runtime images Dockerfile.self-hosted builds FROM:
#   ghcr.io/<this repository>/base-frontend
#   ghcr.io/<this repository>/base-backend
# for linux/amd64 and linux/arm64, from base-images/, with --pull and
# `apt-get upgrade` so each rebuild picks up current Debian fixes.
#
# "Publish Self-Hosted Image" calls this before every release build, so a
# release never builds on stale or missing base images. The weekly run keeps
# them fresh for anyone building Dockerfile.self-hosted from a checkout.
#
# Packages this workflow creates start private. The repository can already
# pull them (it published them), but anyone else building from source needs
# them public: set base-frontend and base-backend to Public in their package
# settings once, after the first run. GITHUB_TOKEN cannot change visibility.

on:
  workflow_call:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base-frontend:
    name: Build & Push base-frontend
    runs-on: ubuntu-latest
    # arm64 is built through QEMU; a stalled emulated build fails here instead
    # of running for hours.
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "tag=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Build & push base-frontend image
        uses: docker/build-push-action@v7
        with:
          context: base-images/frontend
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          # Links the package to this repository on its first publish, so it
          # inherits the repository's access settings.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/base-frontend:latest
            ghcr.io/${{ github.repository }}/base-frontend:${{ steps.date.outputs.tag }}

      # Reporting only: whether a CVE blocks a release is decided by the scan of
      # the finished image in "Publish Self-Hosted Image".
      - name: Scan base-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/base-frontend:${{ steps.date.outputs.tag }}
          format: 'json'
          output: 'trivy-base-frontend.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload base-frontend scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-base-frontend-results
          path: trivy-base-frontend.json
          retention-days: 30
          if-no-files-found: warn

  base-backend:
    name: Build & Push base-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "tag=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Build & push base-backend image
        uses: docker/build-push-action@v7
        with:
          context: base-images/backend
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/base-backend:latest
            ghcr.io/${{ github.repository }}/base-backend:${{ steps.date.outputs.tag }}

      - name: Scan base-backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/base-backend:${{ steps.date.outputs.tag }}
          format: 'json'
          output: 'trivy-base-backend.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload base-backend scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-base-backend-results
          path: trivy-base-backend.json
          retention-days: 30
          if-no-files-found: warn
